name: Deploy to GitHub Pages

on:
  workflow_dispatch: # Manual trigger only

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # peaceiris/actions-gh-pages@v4 still runs on Node.js 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install dependencies
        run: npm ci

      - name: Build for GitHub Pages
        env:
          VITE_DATABASE_URL: ${{ secrets.VITE_DATABASE_URL }}
          VITE_DATABASE_ANON_KEY: ${{ secrets.VITE_DATABASE_ANON_KEY }}
          WARFRAME_API_FRONT_PROXY_BASE_URL: ${{ secrets.WARFRAME_API_FRONT_PROXY_BASE_URL }}
          WARFRAME_API_FRONT_PROXY_TOKEN: ${{ secrets.WARFRAME_API_FRONT_PROXY_TOKEN }}
        run: node build-gh-pages.js

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy to GitHub Pages'
