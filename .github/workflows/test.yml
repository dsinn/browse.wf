name: Test

on:
  pull_request:
  push:
    branches:
      - kouhai
      - senpai

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint TypeScript files
        run: npm run lint
      - name: Type check
        run: npm exec tsc

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - &setup-php
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - run: npm ci
      - name: Compile TypeScript
        run: npm exec tsc
      - name: Run unit tests
        run: npm test -- --run
        timeout-minutes: 1

  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - *setup-php
      - run: npm ci
      - name: Compile TypeScript
        run: npm run compile
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: npm run test:e2e -- --reporter=list
        timeout-minutes: 5
        env:
          # Fake credentials so isDatabaseConfigured() returns true and auth-init.ts
          # creates a Supabase client. The simulateLoggedIn() helper intercepts the
          # cloud-sync-* events before any real auth calls are made.
          VITE_DATABASE_URL: https://placeholder.supabase.test
          VITE_DATABASE_ANON_KEY: placeholder-anon-key
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
